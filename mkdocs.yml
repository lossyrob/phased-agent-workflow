# MkDocs configuration for Phased Agent Workflow documentation
#
# Build locally:   mkdocs build
# Serve locally:   mkdocs serve (then visit http://localhost:8000)
# Deploy to GH Pages: mkdocs gh-deploy --force
#
# See https://www.mkdocs.org/user-guide/configuration/ for options
# See https://squidfunk.github.io/mkdocs-material/ for Material theme docs

site_name: Phased Agent Workflow (PAW)
site_url: https://lossyrob.github.io/phased-agent-workflow
site_description: Agent workflow for taking tasks from issue to reviewed pull request, and for reviewing pull requests, in GitHub Copilot CLI and VS Code
site_author: PAW Contributors

repo_url: https://github.com/lossyrob/phased-agent-workflow
repo_name: lossyrob/phased-agent-workflow

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
    - Getting Started: guide/index.md
    - CLI Installation: guide/cli-installation.md
    - VS Code Extension: guide/vscode-extension.md
    - Workflows: guide/two-workflows.md
    - Configuration and Presets: guide/workflow-presets.md
    - Society-of-Thought Review: guide/society-of-thought-review.md
    - Migrating from v1: guide/migration.md
  - Specification:
    - Overview: specification/index.md
    - PAW v2 Design: specification/v2/design.md
    - Invariant Catalogue: specification/v2/invariants.md
    - Runtime Capabilities: specification/v2/runtime-capabilities.md
    - Review Workflow: specification/review.md
  - Reference:
    - Agents and Skills: reference/agents.md
    - Artifacts: reference/artifacts.md
  - Release Notes: release-notes.md
